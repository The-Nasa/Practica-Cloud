services:
  - type: web
    name: quickly-backend
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: SESSION_SECRET
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SESSION_COOKIE_SAMESITE
        value: "none"
      - key: SESSION_TTL_HOURS
        value: "72"
      - key: CORS_ORIGIN
        value: "https://frontend-quickly-navy.vercel.app"
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: GOOGLE_CLIENT_ID
        sync: false
