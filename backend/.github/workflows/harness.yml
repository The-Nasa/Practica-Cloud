name: Backend harness
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: quickly_test
          POSTGRES_PASSWORD: test_ci_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U quickly_test -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://quickly_test:test_ci_only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run harness:check
        env:
          TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
