name: Deploy to AWS EC2

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Executing remote SSH commands on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            echo "=== 1. Verificando Docker en EC2 ==="
            if ! command -v docker &> /dev/null; then
              echo "Instalando Docker y Docker Compose..."
              sudo apt-get update -y
              sudo apt-get install -y docker.io docker-compose git
              sudo systemctl enable --now docker
              sudo usermod -aG docker $USER
            fi

            echo "=== 2. Verificando Repositorio ==="
            TARGET_DIR="$HOME/Practica-Cloud"
            if [ ! -d "$TARGET_DIR" ]; then
              echo "Clonando repositorio por primera vez..."
              git clone https://github.com/The-Nasa/Practica-Cloud.git "$TARGET_DIR"
            fi

            cd "$TARGET_DIR"
            echo "Actualizando a los ultimos cambios de main..."
            git fetch origin main
            git reset --hard origin/main

            echo "=== 3. Verificando variables de entorno en backend/deploy/.env ==="
            cd backend/deploy
            if [ ! -f .env ]; then
              echo "Creando .env inicial de staging..."
              RAND_DB_PASS=$(openssl rand -hex 16)
              RAND_APP_PASS=$(openssl rand -hex 20)
              cat <<EOT > .env
STAGING_DB_PASSWORD=${RAND_DB_PASS}
STAGING_APP_PASSWORD=${RAND_APP_PASS}
SITE_ADDRESS=:80
SITE_ORIGIN=http://${{ secrets.EC2_HOST }}
STAGING_DB_PORT=25433
RELEASE_TAG=latest
NODE_ENV=staging
SESSION_COOKIE_SECURE=false
COURIER_FEE_BPS=8000
PENDING_ORDER_TTL_MINUTES=15
EOT
              echo ".env generado correctamente."
            fi

            echo "=== 4. Construyendo y levantando contenedores ==="
            # Usar sudo si el usuario todavia no tiene sesion refrescada con el grupo docker
            DOCKER_CMD="docker compose"
            if ! docker ps &> /dev/null; then
              DOCKER_CMD="sudo docker-compose"
            fi

            $DOCKER_CMD -f compose.staging.yml up -d --build --remove-orphans

            echo "=== 5. Estado de los servicios ==="
            $DOCKER_CMD -f compose.staging.yml ps
